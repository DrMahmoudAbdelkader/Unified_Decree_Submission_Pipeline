# .github/workflows/decree-status-sync.yml
# ============================================================================
# The daily status sweep (decree_status_and_letters_sync.py), now PARALLEL.
#
# WHAT IT DOES (unchanged)
#   Re-checks every decree_request_attempts row that has a website_request_id
#   and has NOT yet reached a final status, pulls its current SMC status (and
#   the letter text for خطاب ادارى), normalizes it through smc_status_map and
#   stamps decree_request_cases.case_status when final. Also refreshes
#   decree_request_month_seed and stores the issued decree number of every
#   approved request - decree-value-sync.yml starts after it (workflow_run), then
#   topup-evidence-fetch.yml after that.
#
# PARALLEL
#   plan  - shard_plan.py (MODE=status) counts the open attempts + seed rows and
#           starts ceil(count / chunk_size) runners (default 40 each, max 15).
#   sync  - one runner per slice, all at once. Each runs the SAME script with
#           SHARD_INDEX / SHARD_COUNT; sharding.py splits the work like this:
#             open attempts   by CASE id  (all attempts of a case stay together,
#                                          because case_status is written per case)
#             seed rows       by request number
#             decree numbers  by request number
#           Per-run budgets are shared, not multiplied: the single-lookup budget
#           is divided by the runner count, and MAX_DECREE_LOOKUPS is applied to
#           the whole queue before it is sliced.
#   Every runner fetches the bulk status windows itself (a handful of calls) -
#   that duplicated read is the price of not needing a shared cache.
#
# The downstream workflows start only when EVERY runner succeeded (a workflow_run
# is 'completed' once all jobs end); one failed runner skips them, as one failed
# job did before.
#
# SCHEDULE - 23:00 UTC (01:00 Cairo winter / 02:00 summer). GitHub may delay a
# scheduled run by minutes; nothing here is date-windowed, so a missed night is
# picked up the next night.
#
# REQUIRED REPOSITORY SECRETS
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
#   SMC_USERNAME_2 / SMC_PASSWORD_2 - dedicated account, so a long sweep never
#       shares a session with a submission run (falls back to SMC_USERNAME).
#   SMC_SENDING_SITE - optional, defaults to 102233.
#   Optional: SMC_POOL_USERNAME_<n> / SMC_POOL_PASSWORD_<n> - one SMC account per
#       runner slot (set smc_account_count). If the portal allows only one live
#       session per account, runners sharing _2 will log each other out.
#
# Max 15 runners (max-parallel) so 5 of GitHub's 20 slots stay free for other workflows.
# ============================================================================

name: Decree Status & Letters Sync (daily)

concurrency:
  group: decree-status-sync
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      max_single_lookups:
        description: "Max targeted lookups for requests older than the bulk window, in TOTAL across all runners (default 300). Raise for a big backlog, e.g. 1000."
        required: false
        default: "1000"
      lookback_days:
        description: "Bulk-window size in days (default 15)"
        required: false
        default: "30"
      max_decree_lookups:
        description: "Max approved requests to pull a decree number for, in TOTAL (default 400). Raise for the one-time backfill, e.g. 3000."
        required: false
        default: "3000"
      chunk_size:
        description: "Open attempts + seed rows per parallel runner (default 40)"
        required: false
        default: "40"
      max_shards:
        description: "Max runners in parallel (default 15)"
        required: false
        default: "15"
      smc_account_count:
        description: "How many SMC_POOL_USERNAME_<n> logins exist (default 1)"
        required: false
        default: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --disable-pip-version-check --quiet requests
      - name: Plan shards
        id: plan
        env:
          MODE: status
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CHUNK_SIZE: ${{ github.event.inputs.chunk_size || '40' }}
          MAX_SHARDS: ${{ github.event.inputs.max_shards || '15' }}
          SMC_ACCOUNT_COUNT: ${{ github.event.inputs.smc_account_count || '1' }}
        run: python shard_plan.py

  sync:
    needs: plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.count != '0' }}
    name: sync (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    # ~1 s per attempt; a runner holds ~40-100 of them. 60 min is a wide margin that
    # still stops a hung session from burning a whole hour per runner.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # requests + beautifulsoup4 are all this needs, but it imports
      # Unified_Decree_Submission_Pipeline for SMCSession, so the full file is
      # the safe choice. NO Playwright/Ghostscript: this job only reads.
      - name: Install Python dependencies
        run: pip install --disable-pip-version-check --quiet -r requirements.txt

      - name: Stagger login (runner ${{ matrix.shard.n }})
        run: sleep $(( (${{ matrix.shard.n }} - 1) * 3 ))

      - name: Run status & letters sync - ${{ matrix.shard.name }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMC_USERNAME_2: ${{ secrets[format('SMC_POOL_USERNAME_{0}', matrix.shard.slot)] || secrets.SMC_USERNAME_2 }}
          SMC_PASSWORD_2: ${{ secrets[format('SMC_POOL_PASSWORD_{0}', matrix.shard.slot)] || secrets.SMC_PASSWORD_2 }}
          SMC_USERNAME: ${{ secrets.SMC_USERNAME }}
          SMC_PASSWORD: ${{ secrets.SMC_PASSWORD }}
          SMC_SENDING_SITE: ${{ secrets.SMC_SENDING_SITE }}
          # On the nightly schedule there are no inputs, so these fall back to the
          # defaults. They must never be an empty string (int(os.environ[...])).
          MAX_SINGLE_STATUS_LOOKUPS: ${{ github.event.inputs.max_single_lookups || '300' }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '15' }}
          MAX_DECREE_LOOKUPS: ${{ github.event.inputs.max_decree_lookups || '400' }}
          SHARD_INDEX: ${{ matrix.shard.shard_index }}
          SHARD_COUNT: ${{ matrix.shard.shard_count }}
        run: python decree_status_and_letters_sync.py
