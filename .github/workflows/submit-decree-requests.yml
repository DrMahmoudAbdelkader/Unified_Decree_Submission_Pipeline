# .github/workflows/submit-decree-requests.yml
# ============================================================================
# Triggered ONLY by the Supabase Edge Function `submit-decree-requests`
# (via the GitHub REST API's workflow_dispatch endpoint) when a user
# clicks "إرسال" in the module's "الإرسال إلى SMC" tab. Never runs on a
# schedule and never runs on push — this is an on-demand action with real
# side effects on the SMC website, so it only fires when a human actually
# asked for it from the module.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   SMC_USERNAME
#   SMC_PASSWORD
#   HMIS_USERNAME   (only needed if the DMS-archive fallback is reachable
#                     from a GitHub-hosted runner — usually it isn't, and
#                     the pipeline's own fallback chain handles that
#                     gracefully by opening a review item instead of
#                     crashing; set these only if you know the CMIS
#                     archive is reachable from outside your network)
#   HMIS_PASSWORD
#
# The edge function's fetch to /dispatches passes case_ids as a single
# comma-separated string input (workflow_dispatch inputs must be strings,
# not arrays) — parse_case_ids() in decree_submission_service.py splits
# it back out. Leave it blank to process every READY_TO_SUBMIT case.
# ============================================================================

name: Submit Decree Requests

on:
  workflow_dispatch:
    inputs:
      case_ids:
        description: "Comma-separated decree_request_cases.id list, or blank for every READY_TO_SUBMIT case"
        required: false
        default: ""

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # wkhtmltopdf + Arabic-capable fonts, matching the old Dockerfile —
      # needed because medical_report_overlay.py / the MDT PDF step shells
      # out to wkhtmltopdf and needs real Arabic glyphs, not tofu boxes.
      - name: Install system dependencies (wkhtmltopdf, Arabic fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wkhtmltopdf fonts-kacst fonts-noto-core libgl1

      - name: Install Python dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Restore submission checkpoint cache
        uses: actions/cache@v4
        with:
          path: decree_checkpoints.json
          key: decree-checkpoints-${{ github.run_id }}
          restore-keys: decree-checkpoints-

      - name: Run submission service
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMC_USERNAME: ${{ secrets.SMC_USERNAME }}
          SMC_PASSWORD: ${{ secrets.SMC_PASSWORD }}
          HMIS_USERNAME: ${{ secrets.HMIS_USERNAME }}
          HMIS_PASSWORD: ${{ secrets.HMIS_PASSWORD }}
          CASE_IDS: ${{ github.event.inputs.case_ids }}
          DECREE_CHECKPOINT_PATH: decree_checkpoints.json
        run: python decree_submission_service.py

      - name: Upload run artifacts (logs, generated PDFs left on disk, if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decree-submission-run-${{ github.run_id }}
          path: |
            decree_checkpoints.json
            /tmp/patient_docs/**
          if-no-files-found: ignore
          retention-days: 14
