# .github/workflows/topup-live-checks.yml
# ============================================================================
# Nightly LIVE CHECKS for EVERY open administrative-letter entry (topup_live_checks.py):
#
#   1) manual requests: a request for the same patient that somebody filed BY HAND on the SMC website (outside the app)
#      and that has not reached «قرار نهائي» / «خطاب ادارى» yet. While one exists the entry is moved to
#      «سبق التعامل معها» and topup_gate.py refuses to send a new request for it.
#   2) ID_CARD entries: looks in patient_document_additions for a scan labeled as national ID that staff saved into the
#      patient's file on/after the letter date. Found -> the entry goes to «تم التصحيح — جاهز للطلب»; not found -> it stays in
#      «بانتظار بطاقة سارية جديدة» and the patient is put on hold (see patient_file_gate.py).
#
# Runs after Top-up Evidence Fetch (which already checked its own entries <20 h ago - those are skipped), and on a fallback
# schedule in case that chain did not run. Each entry is re-checked at most every TOPUP_*_MAX_AGE_H (20 h) unless
# candidate_ids is given (then it is always re-checked).
#
# 3) (v9) «قيمة كافية للصرف» for every TOPUP / PREV_INCLUSIVE entry that is still open OR already SUBMITTED (tracking after a
#    resubmission): the patient's decrees are re-read from the SMC patient page when the stored lookup is older than 20 h - so a
#    decree submitted directly on the SMC website is noticed too - and topup_resolution.py closes every entry that already has a
#    decree issued after the letter whose left value covers one dose (supportive decrees: 500 EGP; otherwise the average price of
#    a dispensed dose). Entries are closed as RESOLVED with the message «تم الحل تلقائياً…» and move to the page's
#    «قيمة كافية للصرف بعد القرار» tab; the tracked request and its resubmission history stay visible on the card.
#
# (v10) ORDER INSIDE THE RUN (topup_live_checks.py main()): 0) topup_family.sweep - one letter per patient + plan family, already-served
#    plans closed (DB only)  1) manual requests, ONE SMC read per patient  2) ID cards  3) decree re-reads, flagged entries first then the
#    STALEST lookup first (the old id order refreshed the same entries every night), then the sufficient-value sweep; a closed entry
#    closes its family. Database load: explicit columns, cached lookups, bulk stamps, no delete+insert of unchanged rows.
#
# Secrets used: SUPABASE_*, SMC_USERNAME_3/_2/SMC_USERNAME (+ passwords), R2_*.
# ============================================================================
name: Top-up Live Checks

concurrency:
  group: topup-live-checks
  cancel-in-progress: false

on:
  workflow_run:
    workflows: ["Top-up Evidence Fetch"]
    types: [completed]
  schedule:
    - cron: "30 4 * * *"            # fallback, 04:30 UTC (06:30 Cairo in winter, 07:30 in summer time)
  workflow_dispatch:
    inputs:
      candidate_ids:
        description: "Optional: only these decree_topup_candidates ids (comma separated). Empty = every open entry that is due."
        required: false
        default: ""

jobs:
  live:
    # after the evidence run whatever its result - the checks do not depend on it
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SMC_USERNAME_3: ${{ secrets.SMC_USERNAME_3 }}
      SMC_PASSWORD_3: ${{ secrets.SMC_PASSWORD_3 }}
      SMC_USERNAME_2: ${{ secrets.SMC_USERNAME_2 }}
      SMC_PASSWORD_2: ${{ secrets.SMC_PASSWORD_2 }}
      SMC_USERNAME: ${{ secrets.SMC_USERNAME }}
      SMC_PASSWORD: ${{ secrets.SMC_PASSWORD }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      CANDIDATE_IDS: ${{ github.event.inputs.candidate_ids }}
      LIVE_CHECK_BUDGET_MIN: "80"
      # CHECK 3 knobs (repository variables; empty = script default)
      TOPUP_SUPPORTIVE_DOSE_VALUE: ${{ vars.TOPUP_SUPPORTIVE_DOSE_VALUE }}
      TOPUP_AUTO_RESOLVE_SUBMITTED: ${{ vars.TOPUP_AUTO_RESOLVE_SUBMITTED }}
      TOPUP_REFRESH_LOOKUPS: ${{ vars.TOPUP_REFRESH_LOOKUPS }}
      TOPUP_LOOKUP_MAX_AGE_H: ${{ vars.TOPUP_LOOKUP_MAX_AGE_H }}
      TOPUP_REFRESH_MAX: ${{ vars.TOPUP_REFRESH_MAX }}
      # (v10) families: one letter per patient + plan (empty = default; TOPUP_FAMILY=0 off, TOPUP_FAMILY_APPLY=0 dry run)
      TOPUP_FAMILY: ${{ vars.TOPUP_FAMILY }}
      TOPUP_FAMILY_APPLY: ${{ vars.TOPUP_FAMILY_APPLY }}
      TOPUP_FAMILY_IGNORE_DOSE_COUNT: ${{ vars.TOPUP_FAMILY_IGNORE_DOSE_COUNT }}
      TOPUP_FAMILY_MATCH: ${{ vars.TOPUP_FAMILY_MATCH }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      # no Playwright / Ghostscript: this job only reads SMC and Supabase
      - name: Install Python dependencies
        run: pip install --disable-pip-version-check --quiet -r requirements.txt "pypdf>=5,<6" boto3 PyMuPDF beautifulsoup4
      - name: Run live checks
        run: python topup_live_checks.py
