# .github/workflows/submit-decree-prepare.yml
# ============================================================================
# Triggered by the Supabase Edge Function `submit-decree-requests` (phase=
# "prepare") when a user clicks "إرسال" in the module's "الإرسال إلى SMC"
# tab. Creates the MDT request and locates the patient document; if the
# document is already in the permanent R2 cache (previously reviewed and
# approved), this run continues straight through to a full submission. If
# it's freshly extracted, this run stops and opens a review item instead.
#
# Required repository secrets:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
#   SMC_USERNAME, SMC_PASSWORD
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME
#   HMIS_USERNAME, HMIS_PASSWORD   (only if the CMIS archive fallback is
#                                    reachable from a GitHub-hosted runner)
#
# One-time manual setup (not part of this workflow):
#   Upload signatures/sig1.png..sig4.png, signatures/stamp.png, and
#   medical_report_template.pdf to the Supabase Storage bucket
#   "decree-assets" (private). See supabase_storage.py's docstring.
# ============================================================================

name: Submit Decree Requests (Prepare)

on:
  workflow_dispatch:
    inputs:
      case_ids:
        description: "Comma-separated decree_request_cases.id list, or blank for every READY_TO_SUBMIT case"
        required: false
        default: ""

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # SUPERSEDES the old wkhtmltopdf install: wkhtmltopdf's own frozen
      # WebKit engine (not just its cookie handling) was producing a
      # disrupted/disoriented MDT form compared to a manual browser print -
      # see render_print_page_to_pdf()'s docstring. A real, current
      # Chromium via Playwright renders the page's actual @media print
      # stylesheet and paints CSS backgrounds by default, matching a
      # manual print far more closely.
      - name: Install Python dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Install Playwright's Chromium
        run: playwright install --with-deps chromium

      # fonts-hosny-amiri stays - it's what medical_report_overlay.py uses
      # to draw the SEPARATE medical-report PDF (already calibrated, not
      # the thing that was broken). The MDT FORM itself is server-rendered
      # HTML styled by the SMC site's OWN CSS, which almost certainly asks
      # for Tahoma (see medical_report_overlay.py's own note on this) -
      # Amiri is a different typeface and won't satisfy that request, so
      # without Tahoma actually installed, Chromium/fontconfig falls back
      # to a wider generic sans (DejaVu/Liberation), which is what caused
      # the extra line-wraps and the reversed date split you saw in the
      # CI-rendered form vs. the local one.
      #
      # Tahoma ships with Windows and Microsoft's redistribution terms
      # don't clearly permit committing it into a public repo, so it's
      # installed here from a base64'd repo secret instead - set
      # MDT_FORM_FONT_TTF_BASE64 (and _BOLD) to `certutil -encode` (or
      # `[Convert]::ToBase64String(...)` in PowerShell) of your own local
      # C:\Windows\Fonts\tahoma.ttf / tahomabd.ttf, with the header/footer
      # lines certutil adds stripped out. Confirm first (locally, logged
      # into the SMC print page, via DevTools' computed font-family) that
      # Tahoma really is what the page asks for.
      - name: Install matching MDT-form font from secret
        env:
          MDT_FORM_FONT_TTF_BASE64: ${{ secrets.MDT_FORM_FONT_TTF_BASE64 }}
          MDT_FORM_FONT_BOLD_TTF_BASE64: ${{ secrets.MDT_FORM_FONT_BOLD_TTF_BASE64 }}
        run: |
          if [ -n "$MDT_FORM_FONT_TTF_BASE64" ]; then
            sudo mkdir -p /usr/share/fonts/truetype/mdt-form
            echo "$MDT_FORM_FONT_TTF_BASE64" | base64 -d | sudo tee /usr/share/fonts/truetype/mdt-form/mdt-form.ttf > /dev/null
            if [ -n "$MDT_FORM_FONT_BOLD_TTF_BASE64" ]; then
              echo "$MDT_FORM_FONT_BOLD_TTF_BASE64" | base64 -d | sudo tee /usr/share/fonts/truetype/mdt-form/mdt-form-bold.ttf > /dev/null
            fi
            sudo fc-cache -f -v
          else
            echo "::warning::MDT_FORM_FONT_TTF_BASE64 secret not set - the rendered MDT form will use a fallback font and may not match the local layout."
          fi

      - name: Run prepare (MDT creation + document lookup)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMC_USERNAME: ${{ secrets.SMC_USERNAME }}
          SMC_PASSWORD: ${{ secrets.SMC_PASSWORD }}
          HMIS_USERNAME: ${{ secrets.HMIS_USERNAME }}
          HMIS_PASSWORD: ${{ secrets.HMIS_PASSWORD }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          CASE_IDS: ${{ github.event.inputs.case_ids }}
        run: python decree_submission_prepare.py

      - name: Upload run artifacts (logs, debug dumps, if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decree-prepare-run-${{ github.run_id }}
          path: |
            /tmp/decree_merged/**
          if-no-files-found: ignore
          retention-days: 14
