# .github/workflows/submit-decree-prepare.yml
# ============================================================================
# Triggered by the Supabase Edge Function `submit-decree-requests` (phase=
# "prepare") when a user clicks "إرسال" in the module's "الإرسال إلى SMC"
# tab. Creates the MDT request and locates the patient document; if the
# document is already in the permanent R2 cache (previously reviewed and
# approved), this run continues straight through to a full submission. If
# it's freshly extracted, this run stops and opens a review item instead.
#
# Required repository secrets:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
#   SMC_USERNAME, SMC_PASSWORD
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME
#   HMIS_USERNAME, HMIS_PASSWORD   (only if the CMIS archive fallback is
#                                    reachable from a GitHub-hosted runner)
#
# One-time manual setup (not part of this workflow):
#   Upload signatures/sig1.png..sig4.png, signatures/stamp.png, and
#   medical_report_template.pdf to the Supabase Storage bucket
#   "decree-assets" (private). See supabase_storage.py's docstring.
# ============================================================================

name: Submit Decree Requests (Prepare)

on:
  workflow_dispatch:
    inputs:
      case_ids:
        description: "Comma-separated decree_request_cases.id list, or blank for every READY_TO_SUBMIT case"
        required: false
        default: ""

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # FIXED BUG: `apt-get install wkhtmltopdf` on Ubuntu pulls the
      # UNPATCHED-Qt build from the distro repos — a deprecated build
      # wkhtmltopdf's own maintainers warn against, with known-broken
      # cookie/session handling. That's why every rendered "MDT print page"
      # came back as the logged-out landing page no matter how many times
      # the script re-logged in: it's not a flaky auth issue, the unpatched
      # renderer structurally can't carry an authenticated session.
      # Installing the official statically-linked, patched-Qt .deb instead
      # (same one the local Windows install effectively uses) fixes this.
      - name: Install system dependencies (patched-Qt wkhtmltopdf, Amiri font)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-hosny-amiri libgl1 xfonts-75dpi fontconfig \
            libjpeg-turbo8 libxrender1 libxext6 libjpeg8
          wget -q https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-2/wkhtmltox_0.12.6.1-2.jammy_amd64.deb
          sudo dpkg -i wkhtmltox_0.12.6.1-2.jammy_amd64.deb || sudo apt-get install -f -y
          wkhtmltopdf --version  # must print "(with patched qt)" — fail loudly here, not deep in a render step
          wkhtmltopdf --version | grep -q "with patched qt"

      - name: Install Python dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run prepare (MDT creation + document lookup)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMC_USERNAME: ${{ secrets.SMC_USERNAME }}
          SMC_PASSWORD: ${{ secrets.SMC_PASSWORD }}
          HMIS_USERNAME: ${{ secrets.HMIS_USERNAME }}
          HMIS_PASSWORD: ${{ secrets.HMIS_PASSWORD }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          CASE_IDS: ${{ github.event.inputs.case_ids }}
          # the official .deb installs to /usr/local/bin, NOT /usr/bin
          # (decree_common.py's default) — must be set explicitly or the
          # script falls back to /usr/bin/wkhtmltopdf, which apt may still
          # have installed as a dependency-resolution side effect.
          WKHTMLTOPDF_PATH: /usr/local/bin/wkhtmltopdf
        run: python decree_submission_prepare.py

      - name: Upload run artifacts (logs, debug dumps, if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decree-prepare-run-${{ github.run_id }}
          path: |
            /tmp/decree_merged/**
          if-no-files-found: ignore
          retention-days: 14
