# .github/workflows/submit-decree-prepare.yml
# ============================================================================
# Same trigger and same secrets as before. The ONLY structural change: this
# workflow now runs in two jobs instead of one.
#
#   plan     - resolves the READY_TO_SUBMIT case list (identical filter to
#              decree_submission_prepare.main()) and splits it into batches
#              of CHUNK_SIZE (default 10), keeping every case of one patient
#              inside one batch. See chunk_cases.py for WHY that grouping is
#              not optional.
#   prepare  - a matrix job, one run per batch, each invoked with an
#              explicit CASE_IDS list. Never blank.
#
# WHAT DID NOT CHANGE: decree_submission_prepare.py, decree_common.py,
# Unified_Decree_Submission_Pipeline.py, the edge function, and the finalize
# workflow are all untouched. Each batch job is byte-for-byte the same
# `python decree_submission_prepare.py` invocation you run today, just with
# a shorter CASE_IDS. Every requirement message, every log_event, every
# error classifier and every exit-code rule behaves exactly as before,
# per batch.
#
# START AT max-parallel: 1. It gives you the isolation benefit (one bad
# batch can no longer eat the whole queue's 60-minute budget, and a crash
# after batch 3 leaves batches 4..N untouched and still READY_TO_SUBMIT)
# with zero new risk. Only raise it to 2 after you have confirmed the SMC
# account tolerates two simultaneous logins — see the comment on
# max-parallel below.
#
# One-time manual setup (unchanged): upload signatures/sig1.png..sig4.png,
# signatures/stamp.png, medical_report_template.pdf, fonts/mdt_form_font.ttf
# and fonts/mdt_form_font_bold.ttf to the private Supabase Storage bucket
# "decree-assets". See supabase_storage.py's docstring.
# ============================================================================

name: Submit Decree Requests (Prepare)

on:
  workflow_dispatch:
    inputs:
      case_ids:
        description: "Comma-separated decree_request_cases.id list, or blank for every READY_TO_SUBMIT case"
        required: false
        default: ""
      debug_render_mdt_and_stop:
        description: >-
          DEBUG: creates the MDT for ONE case (case_ids must be exactly
          one id), renders it, uploads the raw + signed PDFs as this
          run's own artifact, and stops — no report/merge/upload happens
          and the case is left as READY_TO_SUBMIT. Use this to check a
          font/layout fix before letting a run submit for real.
        required: false
        type: boolean
        default: false
      chunk_size:
        description: "Cases per batch run (default 10). A patient's cases are never split across batches, so a batch can exceed this."
        required: false
        default: "10"

jobs:
  # ==========================================================================
  # JOB 1 — PLAN. Cheap: one SELECT, no Playwright, no PDF libs, ~20s.
  # ==========================================================================
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.chunk.outputs.matrix }}
      count: ${{ steps.chunk.outputs.count }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # chunk_cases.py imports supabase_client only — requests is its whole
      # dependency tree. Deliberately NOT `pip install -r requirements.txt`:
      # this job has no reason to pay for PyMuPDF/reportlab/boto3.
      - name: Install planner dependency
        run: pip install --disable-pip-version-check --quiet requests

      - name: Plan batches
        id: chunk
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CASE_IDS: ${{ github.event.inputs.case_ids }}
          CHUNK_SIZE: ${{ github.event.inputs.chunk_size || '10' }}
          DEBUG_RENDER_MDT_AND_STOP: ${{ github.event.inputs.debug_render_mdt_and_stop }}
        run: python chunk_cases.py

  # ==========================================================================
  # JOB 2 — one run per batch of 10.
  # ==========================================================================
  prepare:
    needs: plan
    # An empty matrix is a hard error in Actions, so skip the whole job when
    # there is nothing READY_TO_SUBMIT. The old single-job workflow handled
    # this by just running and reporting 0 cases.
    if: ${{ needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    # Was 60 for the entire queue; each batch is ~10 cases now.
    timeout-minutes: 30
    strategy:
      # One batch failing must never cancel the others. Without this, a
      # single batch exiting 1 (which prepare.py does when EVERY case in it
      # errored) would cancel batches that are mid-submission — potentially
      # after an MDT was created on SMC but before the upload.
      fail-fast: false
      # 1 = batches run one after another. Same total wall-clock as today,
      # but full crash isolation between batches.
      #
      # Before raising this to 2, confirm on a quiet day that two runs
      # logged in as the same SMC_USERNAME at once do not invalidate each
      # other's session. If the site enforces one session per account, the
      # second login silently kills the first, and the victim's
      # call_with_reconnect() will re-login in a loop (5 retries, 5s apart,
      # per stage) and eventually fail cases that were otherwise fine.
      # Nothing in this repo can detect that for you in advance.
      max-parallel: 1
      matrix:
        batch: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: pip install --disable-pip-version-check --quiet -r requirements.txt

      # Chromium (via Playwright) replaced wkhtmltopdf because wkhtmltopdf's
      # frozen WebKit engine was the actual source of the disrupted MDT form
      # — see render_print_page_to_pdf()'s docstring. Unchanged.
      #
      # NEW: the downloaded browser is cached. `playwright install` re-
      # downloads ~130 MB otherwise, and with N batch runs you were paying
      # that N times. The cache key pins the Playwright version so a version
      # bump in requirements.txt invalidates it automatically.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      # --with-deps is an apt-get of Chromium's shared libraries and is the
      # slow half of this step. GitHub's ubuntu-latest image already ships
      # almost all of them. Kept ONLY for the cold-cache run, so the very
      # first run after a cache miss still self-heals if a library really is
      # missing; warm runs skip straight to the binary.
      - name: Install Playwright's Chromium (cold cache)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install Playwright's Chromium (warm cache, no-op if present)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install chromium

      # fonts-hosny-amiri is what medical_report_overlay.py draws the
      # SEPARATE medical-report PDF with, and decree_common.
      # fetch_and_configure_assets() hard-fails if it's missing — so it
      # stays. Ghostscript is compress_pdf_under_limit.py's preferred path;
      # without it every oversized merged PDF falls to the slower, lossier
      # PyMuPDF rasterizer.
      #
      # NEW: both in one apt transaction, guarded so an image that already
      # has them skips the install entirely, and with a retry so a flaky
      # mirror doesn't fail the batch before a single case is touched.
      - name: Install Ghostscript + Amiri font (skipped if already present)
        run: |
          need=""
          command -v gs >/dev/null 2>&1 || need="$need ghostscript"
          fc-list 2>/dev/null | grep -qi amiri || need="$need fonts-hosny-amiri"
          if [ -n "$need" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq -o Acquire::Retries=3 $need
          else
            echo "ghostscript and fonts-hosny-amiri already present — skipping apt."
          fi

      - name: Run prepare (MDT creation + document lookup) — ${{ matrix.batch.name }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMC_USERNAME: ${{ secrets.SMC_USERNAME }}
          SMC_PASSWORD: ${{ secrets.SMC_PASSWORD }}
          HMIS_USERNAME: ${{ secrets.HMIS_USERNAME }}
          HMIS_PASSWORD: ${{ secrets.HMIS_PASSWORD }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          # ALWAYS an explicit list from the planner — never blank, or this
          # batch would process the entire READY_TO_SUBMIT queue.
          CASE_IDS: ${{ matrix.batch.case_ids }}
          DEBUG_RENDER_MDT_AND_STOP: ${{ github.event.inputs.debug_render_mdt_and_stop }}
        run: python decree_submission_prepare.py

      # CHANGED: was `if: always()`. /tmp/decree_merged holds the MERGED
      # PATIENT SUBMISSION PDFs — real patient documents. Uploading them on
      # every successful run costs upload time and parks patient data in
      # GitHub's artifact storage for 14 days for no diagnostic reason:
      # everything you actually triage on lives in decree_request_
      # requirements / decree_request_events, which this does not touch.
      # Now kept only when the batch failed, which is the only time anyone
      # has ever opened it.
      #
      # NOTE the artifact name now includes the batch name — actions/
      # upload-artifact@v4 ERRORS on a duplicate artifact name within one
      # run, so with a matrix this is mandatory, not cosmetic.
      - name: Upload run artifacts (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: decree-prepare-run-${{ github.run_id }}-${{ matrix.batch.name }}
          path: |
            /tmp/decree_merged/**
          if-no-files-found: ignore
          retention-days: 14

      # Only populated when debug_render_mdt_and_stop is true (see
      # decree_submission_prepare.debug_dump_mdt_and_stop) — a SEPARATE
      # artifact, on purpose, so a real run's merged submission PDFs and a
      # debug run's isolated MDT renders never mix in the same download.
      - name: Upload MDT debug render (only if debug_render_mdt_and_stop was on)
        if: always() && github.event.inputs.debug_render_mdt_and_stop == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: decree-mdt-debug-${{ github.run_id }}-${{ matrix.batch.name }}
          path: |
            /tmp/decree_mdt_debug/**
          if-no-files-found: ignore
          retention-days: 5
