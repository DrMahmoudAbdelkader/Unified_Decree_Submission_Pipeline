# .github/workflows/submit-decree-prepare.yml
# ============================================================================
# Triggered by the Supabase Edge Function `submit-decree-requests` (phase=
# "prepare") when a user clicks "إرسال" in the module's "الإرسال إلى SMC"
# tab. Creates the MDT request and locates the patient document; if the
# document is already in the permanent R2 cache (previously reviewed and
# approved), this run continues straight through to a full submission. If
# it's freshly extracted, this run stops and opens a review item instead.
#
# Required repository secrets:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
#   SMC_USERNAME, SMC_PASSWORD
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME
#   HMIS_USERNAME, HMIS_PASSWORD   (only if the CMIS archive fallback is
#                                    reachable from a GitHub-hosted runner)
#
# One-time manual setup (not part of this workflow):
#   Upload signatures/sig1.png..sig4.png, signatures/stamp.png,
#   medical_report_template.pdf, and fonts/mdt_form_font.ttf +
#   fonts/mdt_form_font_bold.ttf to the Supabase Storage bucket
#   "decree-assets" (private). See supabase_storage.py's docstring.
#
# NOTE: the MDT-form font is deliberately NOT installed via a GitHub
# Actions secret. A GitHub secret caps out at 64 KB — far smaller than a
# real .ttf file — so the previous "install font from base64 secret" step
# could never actually work (that's why you saw the "secret not set"
# warning even after trying to set it). The font now lives in the private
# Supabase Storage "decree-assets" bucket and is downloaded + registered
# with fontconfig at runtime by decree_common.fetch_and_configure_assets()
# -> supabase_storage.fetch_mdt_form_font(), inside the Python run step
# below. No sudo, no separate workflow step, nothing to base64-encode.
# ============================================================================

name: Submit Decree Requests (Prepare)

on:
  workflow_dispatch:
    inputs:
      case_ids:
        description: "Comma-separated decree_request_cases.id list, or blank for every READY_TO_SUBMIT case"
        required: false
        default: ""
      debug_render_mdt_and_stop:
        description: >-
          DEBUG: creates the MDT for ONE case (case_ids must be exactly
          one id), renders it, uploads the raw + signed PDFs as this
          run's own artifact, and stops — no report/merge/upload happens
          and the case is left as READY_TO_SUBMIT. Use this to check a
          font/layout fix before letting a run submit for real.
        required: false
        type: boolean
        default: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # SUPERSEDES the old wkhtmltopdf install: wkhtmltopdf's own frozen
      # WebKit engine (not just its cookie handling) was producing a
      # disrupted/disoriented MDT form compared to a manual browser print -
      # see render_print_page_to_pdf()'s docstring. A real, current
      # Chromium via Playwright renders the page's actual @media print
      # stylesheet and paints CSS backgrounds by default, matching a
      # manual print far more closely.
      - name: Install Python dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Install Playwright's Chromium
        run: playwright install --with-deps chromium

      # fonts-hosny-amiri stays - it's what medical_report_overlay.py uses
      # to draw the SEPARATE medical-report PDF (already calibrated, not
      # the thing that was broken). The MDT FORM itself is server-rendered
      # HTML styled by the SMC site's OWN CSS, which almost certainly asks
      # for Tahoma. That font is fetched from Supabase Storage and
      # installed at runtime by fetch_and_configure_assets() in the Python
      # step below — see supabase_storage.py's fetch_mdt_form_font() for
      # the one-time upload instructions.
      - name: Install Amiri font (medical report PDF)
        run: sudo apt-get update && sudo apt-get install -y fonts-hosny-amiri

      - name: Run prepare (MDT creation + document lookup)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMC_USERNAME: ${{ secrets.SMC_USERNAME }}
          SMC_PASSWORD: ${{ secrets.SMC_PASSWORD }}
          HMIS_USERNAME: ${{ secrets.HMIS_USERNAME }}
          HMIS_PASSWORD: ${{ secrets.HMIS_PASSWORD }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          CASE_IDS: ${{ github.event.inputs.case_ids }}
          DEBUG_RENDER_MDT_AND_STOP: ${{ github.event.inputs.debug_render_mdt_and_stop }}
        run: python decree_submission_prepare.py

      - name: Upload run artifacts (logs, debug dumps, if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decree-prepare-run-${{ github.run_id }}
          path: |
            /tmp/decree_merged/**
          if-no-files-found: ignore
          retention-days: 14

      # Only populated when debug_render_mdt_and_stop is true (see
      # decree_submission_prepare.debug_dump_mdt_and_stop) — a SEPARATE
      # artifact, on purpose, from the one above, so a real run's merged
      # submission PDFs and a debug run's isolated MDT renders never mix
      # in the same download. Short retention since this is meant to be
      # inspected once and thrown away — delete it yourself from this
      # run's page whenever you're done with it, no need to wait.
      - name: Upload MDT debug render (only if debug_render_mdt_and_stop was on)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decree-mdt-debug-${{ github.run_id }}
          path: |
            /tmp/decree_mdt_debug/**
          if-no-files-found: ignore
          retention-days: 5
