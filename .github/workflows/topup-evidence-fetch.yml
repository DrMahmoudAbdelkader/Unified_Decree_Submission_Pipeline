# .github/workflows/topup-evidence-fetch.yml
# Three steps, in this order (each needs the one before it):
#   1) drains the "فحص قرارات المريض" lookups   (topup_decree_lookup.py  - fast; also created
#      automatically for «يفاد بقرار اللجنه السابقه» letters)
#   2) fetches the PREVIOUS DECREE REPORT PDF for those letters           (topup_report_fetch.py)
#   3) builds the signed invoice PDFs for «التجديد في نهاية المده»          (topup_evidence_fetch.py)
#      — every invoice is rendered from its CURRENT unsigned Details page and signed with signature_script.py
#        (SMC's own signed attachment is never used: an invoice that is not yet معتمد can still change)
# National-ID-card letters need no job: a person fixes the card and presses «تم التصحيح» on the page.
# Runs nightly AFTER the status sync + value sync chain, on demand, and when the page's buttons
# «جلب الفواتير الآن» / «فحص قرارات المريض» start it (workflow_dispatch, no inputs needed).
# Uses SMC_USERNAME_3 (same account as the value sync) - falls back to _2 / default.
name: Top-up Evidence Fetch

concurrency:
  group: topup-evidence-fetch
  cancel-in-progress: false

on:
  workflow_run:
    workflows: ["Decree Values Sync"]
    types: [completed]
  workflow_dispatch:
    inputs:
      max_candidates:
        description: "Max invoice candidates this run (default 25)"
        required: false
        default: "25"
      candidate_ids:
        description: "Optional: only these decree_topup_candidates ids (comma separated). Empty = the whole queue. Set by the page's buttons."
        required: false
        default: ""

jobs:
  fetch:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SMC_USERNAME_3: ${{ secrets.SMC_USERNAME_3 }}
      SMC_PASSWORD_3: ${{ secrets.SMC_PASSWORD_3 }}
      SMC_USERNAME_2: ${{ secrets.SMC_USERNAME_2 }}
      SMC_PASSWORD_2: ${{ secrets.SMC_PASSWORD_2 }}
      SMC_USERNAME: ${{ secrets.SMC_USERNAME }}
      SMC_PASSWORD: ${{ secrets.SMC_PASSWORD }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      CANDIDATE_IDS: ${{ github.event.inputs.candidate_ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install Python dependencies
        run: pip install --disable-pip-version-check --quiet -r requirements.txt pypdf boto3 PyMuPDF reportlab pillow numpy playwright beautifulsoup4

      # 1) works through the whole lookup queue (≈7 s per patient; up to 300 / 30 min per run)
      - name: Patient decree lookups (pressed on the page / new previous-report letters)
        continue-on-error: true
        env:
          MAX_LOOKUPS: "300"
          LOOKUP_TIME_BUDGET_MIN: "30"
        run: python topup_decree_lookup.py

      # Chromium + an Arabic font: the previous-decree report is PRINTED from the SMC page, and EVERY invoice is
      # rendered from its Details page before signing — both need them.
      - name: Install Chromium (report print + invoice rendering)
        run: playwright install --with-deps chromium
      - name: Install Arabic font
        run: sudo apt-get install -y fonts-hosny-amiri

      # 2) previous decree report (letters "يفاد بقرار اللجنه السابقه")
      - name: Fetch previous-decree reports
        continue-on-error: true
        env:
          MAX_REPORTS: "40"
          REPORT_TIME_BUDGET_MIN: "25"
        run: python topup_report_fetch.py

      # 3) signed invoices (letters "التجديد في نهاية المده") — rendered unsigned, then signed (needs signature_script.py in the repo root)
      - name: Build signed invoices
        env:
          # all optional repo variables; empty = the script's defaults
          SIGNED_MIN_BLUE_PX: ${{ vars.SIGNED_MIN_BLUE_PX }}        # blue ink the signing must ADD to the page (default 2500)
          LAYOUT_MIN_SPAN_FRAC: ${{ vars.LAYOUT_MIN_SPAN_FRAC }}    # label columns must span this share of the page width (default 0.35)
          SIGNATURE_BASE_URL: ${{ vars.SIGNATURE_BASE_URL }}        # default: the public signature_files bucket
          MAX_CANDIDATES: ${{ github.event.inputs.max_candidates || '25' }}
        run: python topup_evidence_fetch.py
